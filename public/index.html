<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eternal GDPS</title>
<style>
:root{--bg:#f0f0f0;--pn:#fff;--tx:#111;--mu:#595959;--ac:#e10600;--on:#fff;--bd:#cfcfcf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--pn:#161616;--tx:#f5f5f5;--mu:#a3a3a3;--ac:#f0201a;--on:#fff;--bd:#2e2e2e}}
:root[data-theme="dark"]{--bg:#0a0a0a;--pn:#161616;--tx:#f5f5f5;--mu:#a3a3a3;--ac:#f0201a;--on:#fff;--bd:#2e2e2e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Arial,Helvetica,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0a0a0a;z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:#0a0a0a;border-bottom:3px solid #e10600;display:flex;gap:6px;align-items:center;padding:8px 12px;overflow-x:auto}
header a{color:#f5f5f5;text-decoration:none;font-weight:700;padding:6px 12px;border-radius:6px;white-space:nowrap}
header a.on{background:var(--ac);color:var(--on)}
#thm{margin-left:auto}
main{max-width:760px;margin:0 auto;padding:16px 12px 48px}
h1,h2,h3{font-family:"Arial Black",Arial,sans-serif;margin:.2em 0 .4em;line-height:1.15}
h1{font-size:2rem}
.hero{background:var(--pn);border:3px solid var(--bd);border-radius:10px;padding:24px 18px 34px;margin-bottom:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:linear-gradient(135deg,var(--ac) 25%,transparent 25%) -10px 0/20px 20px,linear-gradient(225deg,var(--ac) 25%,transparent 25%) -10px 0/20px 20px}
.hero p{color:var(--mu);max-width:56ch}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.b,.s{background:var(--ac);color:var(--on);border:0;border-radius:6px;font:700 15px Arial,sans-serif;padding:10px 16px;text-decoration:none;cursor:pointer}
.b.g,.s.g{background:transparent;color:var(--tx);border:2px solid var(--bd)}
.s{padding:5px 10px;font-size:14px}
.card{background:var(--pn);border:3px solid var(--bd);border-radius:8px;padding:14px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:12px}
.grid .card{margin:0;text-align:center}
.grid b{display:block;font:900 1.9rem "Arial Black",Arial,sans-serif;color:var(--ac)}
header a.logo{padding:0;line-height:0;margin-right:6px}
header .s.g{color:#f5f5f5;border-color:#555}
.hh{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hh svg{flex:none}
.b.dc{background:#5865f2;color:#fff}
.b.yt{background:#f00;color:#fff}
.b.dl{background:#fff;color:#0a0a0a;border:2px solid var(--tx)}
.pv{display:block;position:relative;margin:10px 0;border-radius:8px;overflow:hidden;border:3px solid var(--bd);line-height:0}
.pv img,.ni{width:100%;height:auto;display:block}
.ni{border-radius:8px;margin:10px 0}
.pl{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;background:#f00c;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;line-height:1;padding-left:4px}
.steps p{margin:.35em 0;overflow-wrap:anywhere}
.mu{color:var(--mu);font-size:.9rem}
.lv{display:flex;gap:14px;align-items:center}
.rk{color:var(--ac);margin-right:8px}
.in{flex:1;min-width:0}
.tl{display:block;line-height:0;flex:none}
.th{width:210px;max-width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;flex:none;background:#0d0d0d;display:block}
.ph{display:flex;align-items:center;justify-content:center;border:2px solid var(--bd)}
.sep{color:var(--bd)}
.ctl2{display:flex;gap:6px;margin-left:8px}
.tr{align-items:center}
.vf{color:var(--ac)}
@media (max-width:600px){.lv{flex-wrap:wrap}.tl,.th{width:100%}.in{flex-basis:100%}}
.in h3{margin:0}
.ctl{display:flex;flex-direction:column;gap:5px}
details{margin-top:8px}summary{cursor:pointer;font-weight:700}
.rec{padding:3px 0;border-bottom:1px dashed var(--bd)}
.tr{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--bd)}
.tr span:first-child{color:var(--ac);font-weight:900;min-width:24px}
.tr span:nth-child(2){flex:1}
a{color:var(--ac)}
dialog{border:3px solid var(--bd);border-radius:10px;background:var(--pn);color:var(--tx);width:min(92vw,420px);max-height:90vh;overflow:auto}
dialog::backdrop{background:#0008}
label{display:block;margin:8px 0;font-weight:700;font-size:.9rem}
input,textarea{width:100%;font:16px Arial,sans-serif;padding:8px;margin-top:3px;border:2px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
textarea{min-height:90px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ac);color:var(--on);padding:8px 14px;border-radius:6px;font-weight:700;display:none;z-index:20}
</style>
</head>
<body>
<header id="nav"></header>
<main id="app"></main>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<script>
let S={cfg:{name:'',tag:'',discord:'',download:'',youtube:'',steps:''},levels:[],news:[],creators:[],best:[]},pw='';
let admin=false,canEdit=true,timer;
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const u=x=>/^https?:\/\//i.test(x||'')?esc(x):'#';
const PT=[];for(let v=1000;v>=600;v-=40)PT.push(v);for(let v=580;v>=400;v-=20)PT.push(v);for(let v=396;v>=284;v-=4)PT.push(v);for(let v=280;v>=80;v-=8)PT.push(v);for(let v=79;v>=6;v--)PT.push(v);
const pts=i=>PT[i]??0;
function players(){const m={};S.levels.forEach((l,i)=>{const seen=new Set();const add=n=>{n=String(n||'').trim();if(!n)return;const k=n.toLowerCase();if(seen.has(k))return;seen.add(k);const p=m[k]||(m[k]={n,pts:0,c:0});p.pts+=pts(i);p.c++};add(l.ver);l.rec.forEach(r=>{if(r.pct>=100)add(r.p)})});return Object.values(m).sort((a,b)=>b.pts-a.pts||b.c-a.c)}
function creators(){return [...S.creators].sort((a,b)=>b.p-a.p)}
const URLRE=/https?:\/\/[^\s<]+/g;
const ytId=u=>{const m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^#\s]*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/);return m?m[1]:''};
const ui=x=>/^(https?:\/\/|\/api\/img\/)/i.test(x||'')?esc(x):'';
const linkify=t=>esc(t).replace(URLRE,m=>`<a href="${m}" target="_blank" rel="noopener">${m}</a>`).replace(/\n/g,'<br>');
const newsCard=(n,i)=>{const yt=(String(n.x).match(URLRE)||[]).map(ytId).find(Boolean);
return `<div class="card"><div class="mu">${esc(n.d)}</div><h3>${esc(n.t)}</h3><p>${linkify(n.x)}</p>${ui(n.img)?`<img class="ni" src="${ui(n.img)}" alt="" loading="lazy">`:''}${yt?`<a class="pv" href="https://www.youtube.com/watch?v=${yt}" target="_blank" rel="noopener" aria-label="Смотреть на YouTube"><img src="https://i.ytimg.com/vi/${yt}/hqdefault.jpg" alt="Превью видео" loading="lazy"><span class="pl">▶</span></a>`:''}${admin?`<div class="row"><button class="s g" data-act="edN" data-i="${i}">Править</button><button class="s g" data-act="delN" data-i="${i}">Удалить</button></div>`:''}</div>`};
const R={
home(){const c=S.cfg,lk=[['discord','Discord','dc'],['download','Скачать клиент','dl'],['youtube','▶ YouTube','yt']].filter(([k])=>c[k]).map(([k,t,cl])=>`<a class="b ${cl}" href="${u(c[k])}" target="_blank" rel="noopener">${t}</a>`).join('');
return `<section class="hero"><div class="hh">${logo(92)}<div><h1>${esc(c.name)}</h1><p>${esc(c.tag)}</p></div></div><div class="row">${lk||'<span class="mu">Ссылки добавляются в режиме админа.</span>'}</div>${admin?'<button class="s g" data-act="cfg">Править главную</button>':''}</section>
<div class="grid"><div class="card"><b>${S.levels.length}</b>уровней в списке</div><div class="card"><b>${players().length}</b>игроков в рейтинге</div><div class="card"><b>${S.news.length}</b>новостей</div></div>
<div class="card"><h2>Как подключиться</h2><div class="steps">${c.steps.split('\n').filter(Boolean).map(s=>`<p>${esc(s).replace(/https?:\/\/[^\s<]+/g,m=>`<a href="${m}" target="_blank" rel="noopener">${m}</a>`)}</p>`).join('')}</div></div>
${S.news.slice(0,1).map((n)=>newsCard(n,0)).join('')}`},
list(){return `<h1>Демонлист</h1>${admin?'<div class="row"><button class="b" data-act="addL">Добавить уровень</button></div>':''}`+(S.levels.map((l,i)=>`<div class="card lv">${thumb(l)}<div class="in"><h3><span class="rk">#${i+1}</span>${esc(l.n)}</h3><div class="mu">${esc(l.by)} <span class="sep">|</span> <b class="vf">${esc(l.ver||'—')}</b> · ${pts(i)} очков${l.vid?` · <a href="${u(l.vid)}" target="_blank" rel="noopener">Видео</a>`:''}</div><details><summary>Рекорды (${l.rec.length})</summary>${l.rec.map((r,j)=>`<div class="rec">${esc(r.p)}: ${esc(r.pct)}%${r.v?` <a href="${u(r.v)}" target="_blank" rel="noopener">видео</a>`:''}${admin?` <button class="s g" data-act="delR" data-i="${i}" data-j="${j}">Удалить</button>`:''}</div>`).join('')||'<div class="mu">Пока нет рекордов.</div>'}</details></div>${admin?`<div class="ctl"><button class="s" data-act="up" data-i="${i}">Выше</button><button class="s" data-act="dn" data-i="${i}">Ниже</button><button class="s g" data-act="edL" data-i="${i}">Править</button><button class="s g" data-act="addR" data-i="${i}">Рекорд</button><button class="s g" data-act="delL" data-i="${i}">Удалить</button></div>`:''}</div>`).join('')||'<div class="card">Список пуст. Включите режим админа и добавьте первый уровень.</div>')},
best(){return `<h1>Лучшие уровни</h1>${admin?'<div class="row"><button class="b" data-act="addB">Добавить уровень</button></div>':''}`+(S.best.map((l,i)=>`<div class="card lv">${thumb(l)}<div class="in"><h3>${esc(l.n)}</h3><div class="mu">${l.by?esc(l.by)+' · ':''}ID: <b class="vf">${esc(l.id||'—')}</b>${l.id?` <button class="s g" data-act="cpId" data-id="${esc(l.id)}">Копировать</button>`:''}</div></div>${admin?`<div class="ctl"><button class="s" data-act="upB" data-i="${i}">Выше</button><button class="s" data-act="dnB" data-i="${i}">Ниже</button><button class="s g" data-act="edB" data-i="${i}">Править</button><button class="s g" data-act="delB" data-i="${i}">Удалить</button></div>`:''}</div>`).join('')||'<div class="card">Пока нет добавленных уровней.</div>')},
top(){const row=(i,name,val,ctl)=>`<div class="tr"><span>${i+1}</span><span>${esc(name)}</span><b>${esc(val)}</b>${ctl||''}</div>`;
const cr=creators();
return `<h1>Топы</h1><div class="card"><h2>Креатор поинты</h2>${admin?'<div class="row"><button class="b" data-act="addC">Добавить креатора</button></div>':''}${cr.slice(0,25).map((c,i)=>{const k=S.creators.indexOf(c);return row(i,c.n,c.p+' CP',admin?`<span class="ctl2"><button class="s g" data-act="edC" data-i="${k}">Править</button><button class="s g" data-act="delC" data-i="${k}">Удалить</button></span>`:'')}).join('')||'<div class="mu">Пока пусто.</div>'}</div><div class="card"><h2>Лучшие игроки</h2><div class="mu">Очки за пройденные и верифнутые уровни демонлиста.</div>${players().slice(0,25).map((p,i)=>row(i,p.n,p.pts+' очков, '+p.c+' ур.')).join('')||'<div class="mu">Пока пусто.</div>'}</div>`},
news(){return `<h1>Новости</h1>${admin?'<div class="row"><button class="b" data-act="addN">Добавить новость</button></div>':''}`+(S.news.map(newsCard).join('')||'<div class="card">Новостей пока нет.</div>')}
};
try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
const curTheme=()=>document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(e){}}
const INF='M256 236C256 236 210 160 150 160C100 160 80 200 80 236C80 272 100 312 150 312C210 312 256 236 256 236C256 236 302 160 362 160C412 160 432 200 432 236C432 272 412 312 362 312C302 312 256 236 256 236Z';
const SP=[0,1,2,3,4,5,6,7].map(i=>{const x=96+i*40;return `M${x} 420L${x+20} 376L${x+40} 420Z`}).join('');
const logo=n=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="${n}" height="${n}" role="img" aria-label="Eternal GDPS"><rect width="512" height="512" rx="104" fill="#0d0d0d"/><rect x="14" y="14" width="484" height="484" rx="92" fill="none" stroke="#e10600" stroke-width="12"/><path d="${INF}" fill="none" stroke="#e10600" stroke-width="36" stroke-linejoin="round" stroke-linecap="round"/><path d="${INF}" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/><rect x="96" y="420" width="320" height="14" fill="#fff"/><path fill="#e10600" d="${SP}"/></svg>`;
{const l=document.createElement('link');l.rel='icon';l.href='data:image/svg+xml,'+encodeURIComponent(logo(64));document.head.appendChild(l)}
const thumb=l=>{const y=ytId(l.vid||'');const src=ui(l.img)||(y?`https://i.ytimg.com/vi/${y}/hqdefault.jpg`:'');const inner=src?`<img class="th" src="${src}" alt="" loading="lazy">`:`<div class="th ph">${logo(56)}</div>`;return l.vid&&u(l.vid)!=='#'?`<a class="tl" href="${u(l.vid)}" target="_blank" rel="noopener" aria-label="Смотреть видео">${inner}</a>`:inner};
const NAV=[['home','Главная'],['list','Демонлист'],['best','Лучшие уровни'],['top','Топы'],['news','Новости']];
function render(){const r=R[location.hash.slice(1)]?location.hash.slice(1):'home';
$('#nav').innerHTML=`<a class="logo" href="#home" aria-label="Главная">${logo(38)}</a>`+NAV.map(([k,t])=>`<a href="#${k}" class="${k==r?'on':''}">${t}</a>`).join('')+`<button id="thm" class="s g" data-act="theme">${curTheme()=='dark'?'☀ День':'☾ Ночь'}</button>`+(canEdit?`<button id="adm" class="s ${admin?'':'g'}" data-act="adm">${admin?'Выйти из админки':'Режим админа'}</button>`:'');
$('#app').innerHTML=R[r]()}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}
function queueSave(){clearTimeout(timer);timer=setTimeout(async()=>{try{const r=await fetch('/api/save',{method:'POST',headers:{'content-type':'application/json','x-admin-password':pw},body:JSON.stringify(S)});if(r.status==401){logout();render();toast('Сессия истекла, войдите снова')}else if(!r.ok)toast('Не сохранилось');else toast('Сохранено')}catch(e){toast('Нет связи с сервером')}},600)}
const commit=()=>{render();queueSave()};
function ask(t,f,v,cb){const d=$('#dlg');d.innerHTML=`<form method="dialog"><h3>${t}</h3>${f.map(([k,l,ty])=>`<label>${l}${ty=='file'?`<input type="file" name="${k}" accept="image/*">`:ty=='area'?`<textarea name="${k}">${esc(v[k])}</textarea>`:`<input name="${k}" ${ty=='number'?'type="number"':ty=='pw'?'type="password"':''} value="${esc(v[k])}">`}</label>`).join('')}<div class="row"><button class="b" value="ok">Сохранить</button><button class="b g" value="x" formnovalidate>Отмена</button></div></form>`;
const fm=d.querySelector('form');d.onclose=()=>{if(d.returnValue=='ok'){if(cb(Object.fromEntries(new FormData(fm)))!==false)commit()}};d.returnValue='';d.showModal()}
const NF=[['t','Заголовок'],['x','Текст (ссылки кликабельны, YouTube покажет превью)','area'],['img','Картинка: ссылка (необязательно)'],['f','Или загрузить файл с компьютера','file']];
async function uploadImg(f){const bm=await createImageBitmap(f);const sc=Math.min(1,1280/bm.width);const c=document.createElement('canvas');c.width=Math.round(bm.width*sc);c.height=Math.round(bm.height*sc);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0,c.width,c.height);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));const r=await fetch('/api/upload',{method:'POST',headers:{'x-admin-password':pw,'content-type':'image/jpeg'},body:blob});if(!r.ok)throw new Error('upload');return (await r.json()).url}
async function saveNews(v,i){let img=(v.img||'').trim();const f=v.f;if(f&&f.size){toast('Загружаю картинку…');try{img=await uploadImg(f)}catch(e){return toast('Не удалось загрузить картинку')}}
const o={t:v.t||'Новость',x:v.x||'',img};if(i==null)S.news.unshift({d:new Date().toISOString().slice(0,10),...o});else Object.assign(S.news[i],o);commit()}
const BF=[['n','Название уровня'],['id','ID уровня'],['by','Автор (необязательно)'],['img','Картинка: ссылка (необязательно)'],['f','Или загрузить картинку с компьютера','file']];
const CF=[['n','Ник креатора'],['p','Креатор поинты','number']];
async function saveBest(v,i){let img=(v.img||'').trim();const f=v.f;if(f&&f.size){toast('Загружаю картинку…');try{img=await uploadImg(f)}catch(e){return toast('Не удалось загрузить картинку')}}
const o={n:v.n||'Без названия',id:String(v.id||'').replace(/\D/g,''),by:v.by||'',img};if(i==null)S.best.push(o);else S.best[i]=o;commit()}
async function saveLevel(v,i){let img=(v.img||'').trim();const f=v.f;if(f&&f.size){toast('Загружаю превью…');try{img=await uploadImg(f)}catch(e){return toast('Не удалось загрузить превью')}}
putL({...v,img},i);commit()}
const LF=[['n','Название'],['by','Автор'],['ver','Верифаер'],['vid','Ссылка на видео'],['img','Превью: ссылка на картинку (необязательно)'],['f','Или загрузить превью с компьютера','file'],['pos','Позиция в списке','number']];
function putL(v,i){const L=S.levels,o={n:v.n||'Без названия',by:v.by||'?',ver:v.ver||'',cp:+v.cp||0,likes:+v.likes||0,vid:v.vid||'',img:v.img||'',rec:i==null?[]:L[i].rec};if(i!=null)L.splice(i,1);const p=Math.min(Math.max(+v.pos||L.length+1,1),L.length+1);L.splice(p-1,0,o)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,i=+b.dataset.i,j=+b.dataset.j,L=S.levels;
if(a.startsWith('del')&&!b.dataset.arm){b.dataset.arm=1;b.textContent='Точно?';return}
if(a=='theme'){setTheme(curTheme()=='dark'?'light':'dark');return render()}
if(a=='adm'){if(admin){logout();return render()}return ask('Вход для админа',[['pw','Пароль','pw']],{},v=>{login(v.pw);return false})}
const A={cfg:()=>ask('Главная страница',[['name','Название'],['tag','Описание'],['discord','Ссылка на Discord'],['download','Ссылка на клиент'],['youtube','Ссылка на YouTube'],['steps','Как подключиться (строка = абзац, ссылки кликабельны)','area']],S.cfg,v=>Object.assign(S.cfg,v)),
addL:()=>ask('Новый уровень',LF,{pos:L.length+1,cp:0,likes:0},v=>{saveLevel(v);return false}),
edL:()=>ask('Уровень',LF,{...L[i],pos:i+1},v=>{saveLevel(v,i);return false}),
up:()=>{if(i>0){[L[i-1],L[i]]=[L[i],L[i-1]];commit()}},
dn:()=>{if(i<L.length-1){[L[i+1],L[i]]=[L[i],L[i+1]];commit()}},
